name: 干净双jar云编译

on:
  workflow_dispatch:
    inputs:
      upstream:
        description: '并入上游最新源？on=自动吸收别人更新，off=只编基座+V8稳定版'
        required: false
        default: 'on'
  push:
    paths:
      - 'build_clean.py'

permissions:
  contents: write

concurrency:
  group: jar-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: 编译
        env:
          UPSTREAM: ${{ github.event.inputs.upstream || 'on' }}
        run: python3 build_clean.py all

      - name: 提交产物
        run: |
          git config user.name nzsm-bot
          git config user.email nzsm@users.noreply.github.com
          git add jar/
          if git diff --cached --quiet; then
            echo "jar 无变化，跳过提交"
            exit 0
          fi
          git commit -m "auto: 双jar $(date -u +%F_%H%M)"
          git pull --rebase origin main || true
          git push || echo "推送失败，产物看附件"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jars
          path: jar/
          if-no-files-found: warn
