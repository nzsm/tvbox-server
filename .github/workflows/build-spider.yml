# ============================================================
# 全能引擎 jar 云编译工作流（默认双产物：全量版 + 精简版，无自动触发）
# 作用：手动触发，自动发现并拉取各影视源引用的 jar → 类级合并去重
#       → 按 dex 64K 上限分 dex → 最小内存重汇编 → 产出两个 jar 并回写仓库：
#   1) jar/qist_spider.jar        全量版：收录所有能拿到的类与原生库（不论大小），
#                                  配置（subscribe.py）直接加载它，不缺类
#   2) jar/qist_spider_lite.jar   精简版：所有爬虫类+依赖链、默认去.so，体积更小
#                                  想用精简版时手动改配置 spider 指向它即可
# 触发机制：仅 workflow_dispatch 手动 Run（已关闭每天自动编译，避免覆盖式自动变更）
# 保存路径：.github/workflows/build-spider.yml
# 产物地址（本仓库自托管）：
#   https://gh-proxy.com/https://raw.githubusercontent.com/nzsm/tvbox-server/main/jar/qist_spider.jar
#   https://gh-proxy.com/https://raw.githubusercontent.com/nzsm/tvbox-server/main/jar/qist_spider_lite.jar
# ============================================================
name: 全能引擎jar云编译

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '生成哪些：both(全量+精简，推荐) / all(仅全量) / closure(仅精简)'
        type: choice
        default: both
        options: [both, all, closure]
      method_target:
        description: '每个 dex 的方法数上限（默认 22000，越小越稳但 dex 越多）'
        type: number
        default: 22000
      java_mem:
        description: '编译内存上限（最小内存，默认 2g，按需可调 1g/2g/3g）'
        type: string
        default: '2g'
      strip_so_closure:
        description: '精简版 qist_spider_lite.jar 是否去原生.so（默认true，更小更快）'
        type: boolean
        default: true
      strip_so_all:
        description: '全量版 qist_spider.jar 是否去原生.so（默认false，保留完整作兜底）'
        type: boolean
        default: false

permissions:
  contents: write          # 用内置 token 自动提交推送，无需配置密钥

concurrency:
  group: engine-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存工具链（baksmali/smali，避免每次重下 Maven 依赖）
        uses: actions/cache@v4
        with:
          path: .merge_tools
          key: merge-tools-${{ runner.os }}

      - name: 运行全能 jar 合并脚本（双产物，最小内存）
        env:
          MODE: ${{ github.event.inputs.mode || 'both' }}
          JAVA_MEM: ${{ github.event.inputs.java_mem || '2g' }}
          DEX_METHOD_TARGET: ${{ github.event.inputs.method_target || 22000 }}
          STRIP_SO_CLOSURE: ${{ github.event.inputs.strip_so_closure == true && '1' || '0' }}
          STRIP_SO_ALL: ${{ github.event.inputs.strip_so_all == true && '1' || '0' }}
        run: |
          python3 merge_engine.py

      - name: 提交并推送 jar 产物（只提交 jar/，避免临时目录入库）
        run: |
          git config user.name "nzsm-bot"
          git config user.email "nzsm@users.noreply.github.com"
          git add jar/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "auto: 云编译引擎jar $(date -u +'%Y-%m-%d %H:%M')"
          # 远端可能已有新提交（用户手动推/其它工作流），先 fetch+rebase 再 push，避免被拒
          git fetch origin main || exit 1
          if ! git rebase origin/main; then
            echo "⚠️ 与远端冲突（多为并发构建同改 jar/），保留本次新构建的 jar"
            git checkout --ours jar/ 2>/dev/null || true
            git add jar/ 2>/dev/null || true
            GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --abort
          fi
          git push

      - name: 上传 jar 附件（网页可直接下载）
        uses: actions/upload-artifact@v4
        with:
          name: engine_jars
          path: |
            jar/qist_spider.jar
            jar/qist_spider_lite.jar
          if-no-files-found: warn
