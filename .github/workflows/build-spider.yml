# ============================================================
# 云编译 spider.jar —— GitHub Actions 全自动管线 v8（增强版）
#
# ★ v8 新增：合并外部大 jar 的独有爬虫（666tv/69 的 pg/66tv 等）
#   你的配置里 csp_ 引用的爬虫类，除 CatVodSpider 源码自带外，
#   还来自这几个大 jar。v8 在编译时自动把它们并进 spider.jar。
#
# 使用：覆盖 .github/workflows/build-spider.yml 后 Run workflow
# 地址：https://ghfast.top/https://raw.githubusercontent.com/nzsm/tvbox-server/main/jar/spider.jar
# ============================================================
name: Build Spider Jar

on:
  workflow_dispatch:
    inputs:
      merge_old:
        description: '合并增强：把仓库现有 jar 独有的爬虫也合进来（推荐）'
        type: boolean
        default: true
      merge_external:
        description: '合并外部大 jar（666tv/69 的 pg/66tv 等，补全 csp 爬虫）'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出自仓库 tvbox-server
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 匿名拉取编译源码 CatVodSpider（public 仓库，不需要 token）
        run: |
          git clone --depth 1 https://github.com/nzsm/CatVodSpider.git src
          echo "源码已拉取: $(ls src/app/build.gradle)"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-33" "build-tools;33.0.1" >/dev/null 2>&1 || true

      - name: Gradle 编译（R8 混淆）
        run: |
          cd src
          chmod +x gradlew
          sed -i 's/targetSdk 28/targetSdk 33/' app/build.gradle
          ./gradlew :app:assembleRelease -x lint -x lintVitalRelease --no-daemon --stacktrace

      - name: 打包（合并增强：旧 jar + 外部大 jar 独有爬虫并入）
        run: |
          set -e
          cd src
          DEX="app/build/intermediates/dex/release/minifyReleaseWithR8/classes.dex"
          ls -la "$DEX"
          # ---- 反编译新源码的 dex ----
          rm -rf smali_new && mkdir -p smali_new
          java -jar jar/3rd/baksmali-2.5.2.jar d "$DEX" -o smali_new
          SPIDER_DIR="smali_new/com/github/catvod/spider"
          PARSER_DIR="smali_new/com/github/catvod/parser"
          JS_DIR="smali_new/com/github/catvod/js"
          echo "新源码爬虫类数: $(find $SPIDER_DIR -name '*.smali' 2>/dev/null | wc -l)"

          # ---- 防御：清理超大方法类（单方法 > ~64KB，dex 硬限制，重编译必炸）----
          python3 << 'PYX'
          import os, re
          THRESH = 12000
          import shutil
          shutil.rmtree('smali_new/com/github/catvob', ignore_errors=True)
          def scan_remove(root, tag):
              removed = []
              for dp, dn, fns in os.walk(root):
                  for fn in fns:
                      if not fn.endswith('.smali'): continue
                      p = os.path.join(dp, fn)
                      with open(p, encoding='utf-8', errors='ignore') as f:
                          lines = f.readlines()
                      in_m = False; start = 0
                      for i, ln in enumerate(lines):
                          s = ln.strip()
                          if s.startswith('.method') and not in_m:
                              in_m = True; start = i
                          elif s == '.end method' and in_m:
                              if i - start > THRESH:
                                  removed.append((os.path.relpath(p, root), i - start + 1))
                                  break
                              in_m = False
                      if removed and removed[-1][0] == os.path.relpath(p, root):
                          os.remove(p)
              return removed
          r1 = scan_remove('smali_new/com/github/catvod', 'new')
          r2 = scan_remove('smali_new', 'all') if os.path.isdir('smali_new/com/github/catvob') else []
          print("clean big methods: new=%d catvob=%d" % (len(r1), len(r2)))
          for r in (r1 + r2)[:8]:
              print("  -", r[0], "lines", r[1])
          PYX

          # ---- 合并增强①：拉取本仓库现有 jar/spider.jar 独有类 ----
          if [ "${{ github.event.inputs.merge_old }}" = "true" ]; then
            echo "进入合并增强模式①（旧 jar）……"
            OLD_JAR="old_spider.jar"
            curl -L -m 120 -o "$OLD_JAR" "https://raw.githubusercontent.com/nzsm/tvbox-server/main/jar/spider.jar" || true
            if [ -s "$OLD_JAR" ]; then
              rm -rf smali_old && mkdir -p smali_old
              java -jar jar/3rd/baksmali-2.5.2.jar d "$OLD_JAR" -o smali_old || true
              OLD_SPIDER="smali_old/com/github/catvod/spider"
              if [ -d "$OLD_SPIDER" ]; then
                ADD=0
                for f in "$OLD_SPIDER"/*.smali; do
                  b=$(basename "$f")
                  if [ ! -f "$SPIDER_DIR/$b" ]; then
                    cp "$f" "$SPIDER_DIR/$b"; ADD=$((ADD+1))
                  fi
                done
                echo "✅ 合并补入旧 jar 独有爬虫类: $ADD 个"
              fi
            fi
            echo "合并①后爬虫类总数: $(find $SPIDER_DIR -name '*.smali' | wc -l)"
          fi

          # ---- 合并增强②：拉取外部大 jar（666tv/69），全包补入独有类（含依赖）----
          if [ "${{ github.event.inputs.merge_external }}" = "true" ]; then
            echo "进入合并增强模式②（外部大 jar）……"
            EXT_DIR="smali_ext"
            rm -rf "$EXT_DIR" && mkdir -p "$EXT_DIR"
            # 外部 jar 清单（666tv/69 大而全包）
            # 外部 jar 清单（大而全包，含 pg/66tv/PGYdanmu/ttkx/maotv/Yu/og + 用户 TVbox 仓库的 lem/wex）
            EXT_JARS=(
              "pg.jar"
              "66tv.jar"
              "Yoursmile2.jar"
              "CFlLnSbJ"
              "PGYdanmu.jar"
              "ttkx240722.jar"
              "maotv.jar"
              "Yu.jar"
              "og.php"
            )
            # 用户 nzsm/TVbox 仓库的补全包（Live2Vod/Wexxpgtv 等独有爬虫）
            EXT_JARS_USER=(
              "jar/lem1225.jar"
              "jar/wex.jar"
              "jar/dd.jar"
              "jar/duo.jar"
            )
            for jn in "${EXT_JARS[@]}"; do
              curl -L -m 120 -o "ext_$jn" "https://ghfast.top/https://raw.githubusercontent.com/666tv/69/main/jar/$jn" || true
              if [ -s "ext_$jn" ]; then
                rm -rf smali_e && mkdir -p smali_e
                java -jar jar/3rd/baksmali-2.5.2.jar d "ext_$jn" -o smali_e || true
                EXT_SPIDER="smali_e/com/github/catvod/spider"
                if [ -d "$EXT_SPIDER" ]; then
                  ADD=0
                  # 只拷贝 spider 目录（递归，含辅助子包），跳过已存在 → 避免 dex 溢出
                  for f in $(find "$EXT_SPIDER" -name '*.smali'); do
                    rel="${f#$EXT_SPIDER/}"
                    dest="$SPIDER_DIR/$rel"
                    if [ ! -f "$dest" ]; then
                      mkdir -p "$(dirname "$dest")"
                      cp "$f" "$dest"; ADD=$((ADD+1))
                    fi
                  done
                  echo "✅ $jn 补入 $ADD 个独有爬虫类"
                fi
              else
                echo "⚠️ $jn 拉取失败，跳过"
              fi
            done
            # 影视仓大包（124.71.19.220：含 App99/AppDrama/AppLY/AppRJ/Gz360/PanWebShare/PanWebShareKF/ShuangXing/TingShijie + 全套 APP/网盘类）
            EXT_JARS_URL=(
              "http://124.71.19.220/jar/1/spider.jar"
              "https://gitee.com/lwlxh/tvhome/raw/master/o.jar"
              "https://file.icve.com.cn/file_doc/81/326/14751AFEF3EF30B1AFFFA398F1E9D961.png"
              "https://file.icve.com.cn/file_doc/874/405/DAB654F794A271C3D7A33D18ACFBFA95.jpg"
              "http://oss4liview.moji.com/thd_file/2026/09/24/06cf2230c30d9c26fa46ea79147b330d.jpg"
              "https://szyyds.cn/tv/x.jpg"
            )
            for jn in "${EXT_JARS_URL[@]}"; do
              curl -L -m 120 -H "User-Agent: okhttp/3.12.1" -o "ext_u_$(basename $jn)" "$jn" || true
              if [ -s "ext_u_$(basename $jn)" ]; then
                rm -rf smali_eu && mkdir -p smali_eu
                java -jar jar/3rd/baksmali-2.5.2.jar d "ext_u_$(basename $jn)" -o smali_eu || true
                EXT_SPIDER="smali_eu/com/github/catvod/spider"
                if [ -d "$EXT_SPIDER" ]; then
                  ADD=0
                  for f in $(find "$EXT_SPIDER" -name '*.smali'); do
                    rel="${f#$EXT_SPIDER/}"
                    dest="$SPIDER_DIR/$rel"
                    if [ ! -f "$dest" ]; then
                      mkdir -p "$(dirname "$dest")"
                      cp "$f" "$dest"; ADD=$((ADD+1))
                    fi
                  done
                  echo "✅ $jn 补入 $ADD 个独有爬虫类"
                fi
              fi
            done
            # 用户 nzsm/TVbox 仓库的补全包
            for jn in "${EXT_JARS_USER[@]}"; do
              curl -L -m 120 -o "ext_u_$(basename $jn)" "https://ghfast.top/https://raw.githubusercontent.com/nzsm/TVbox/main/$jn" || true
              if [ -s "ext_u_$(basename $jn)" ]; then
                rm -rf smali_eu && mkdir -p smali_eu
                java -jar jar/3rd/baksmali-2.5.2.jar d "ext_u_$(basename $jn)" -o smali_eu || true
                EXT_SPIDER="smali_eu/com/github/catvod/spider"
                if [ -d "$EXT_SPIDER" ]; then
                  ADD=0
                  for f in $(find "$EXT_SPIDER" -name '*.smali'); do
                    rel="${f#$EXT_SPIDER/}"
                    dest="$SPIDER_DIR/$rel"
                    if [ ! -f "$dest" ]; then
                      mkdir -p "$(dirname "$dest")"
                      cp "$f" "$dest"; ADD=$((ADD+1))
                    fi
                  done
                  echo "✅ $jn 补入 $ADD 个独有爬虫类"
                fi
              fi
            done
            echo "合并②后爬虫类总数: $(find $SPIDER_DIR -name '*.smali' | wc -l)"
          fi

          # ---- apktool 重打包 ----
          rm -rf spider_build && cp -r jar/spider.jar spider_build
          rm -rf spider_build/smali/com/github/catvod/spider \
                 spider_build/smali/com/github/catvod/parser \
                 spider_build/smali/com/github/catvod/js
          # 全包替换（含辅助类）
          rm -rf spider_build/smali/com/github/catvod
          mkdir -p spider_build/smali/com/github
          mv smali_new/com/github/catvod spider_build/smali/com/github/catvod
          # 最终保险：打包前再清一次超大方法类
          python3 << 'PYX'
          import os
          THRESH = 12000
          import shutil
          shutil.rmtree('spider_build/smali/com/github/catvob', ignore_errors=True)
          removed = []
          for dp, dn, fns in os.walk('spider_build/smali'):
              for fn in fns:
                  if not fn.endswith('.smali'): continue
                  p = os.path.join(dp, fn)
                  with open(p, encoding='utf-8', errors='ignore') as f:
                      lines = f.readlines()
                  in_m = False; start = 0
                  for i, ln in enumerate(lines):
                      s = ln.strip()
                      if s.startswith('.method') and not in_m:
                          in_m = True; start = i
                      elif s == '.end method' and in_m:
                          if i - start > THRESH:
                              removed.append(os.path.relpath(p, 'spider_build/smali'))
                              in_m = False
                              break
                          in_m = False
                  if removed and removed[-1] == os.path.relpath(p, 'spider_build/smali'):
                      os.remove(p)
          print("final clean big methods: %d" % len(removed))
          for r in removed[:8]:
              print("  -", r)
          PYX
          java -jar jar/3rd/apktool_2.4.1.jar b spider_build -c
          cp spider_build/dist/dex.jar spider.jar
          md5sum spider.jar | awk '{print $1}' > spider.jar.md5
          echo "✅ 产出: spider.jar ($(du -h spider.jar | cut -f1))"

      - name: 回写本仓库 jar/spider.jar（GitHub API 直传，tvbox-server）
        run: |
          set -e
          SHA=""
          EXIST=$(curl -s -o /tmp/exist.json -w "%{http_code}" -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/nzsm/tvbox-server/contents/jar/spider.jar")
          if [ "$EXIST" = "200" ]; then
            SHA=$(python3 -c 'import json; print(json.load(open("/tmp/exist.json")).get("sha",""))')
            echo "检测到已存在 jar/spider.jar，将覆盖更新 (sha=$SHA)"
          fi
          {
            printf '{"message":"auto: 云编译 spider.jar %s","content":"' "$(date +%Y%m%d-%H%M)"
            base64 -w0 src/spider.jar
            if [ -n "$SHA" ]; then
              printf '","sha":"%s"}' "$SHA"
            else
              printf '"}'
            fi
          } > /tmp/payload.json
          echo "payload 大小: $(stat -c %s /tmp/payload.json) 字节"
          curl -s -X PUT -H "Authorization: Bearer ${{ github.token }}" \
            --data-binary @/tmp/payload.json \
            "https://api.github.com/repos/nzsm/tvbox-server/contents/jar/spider.jar" > /tmp/result.json || true
          python3 -c 'import json,sys; d=json.load(open("/tmp/result.json")); ok=d.get("content",{}).get("sha"); print(("OK 写回成功 sha="+ok[:10]+" size="+str(d["content"].get("size",""))) if ok else ("FAIL "+str(d.get("message","未知响应"))[:300])); sys.exit(0 if ok else 1)'

      - name: 上传附件（网页可直接下载）
        uses: actions/upload-artifact@v4
        with:
          name: spider_jar
          path: src/spider.jar
