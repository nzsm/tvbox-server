# ============================================================
# 云编译 spider.jar —— GitHub Actions 全自动管线 v8（增强版）
#
# ★ v8 新增：合并外部大 jar 的独有爬虫（666tv/69 的 pg/66tv 等）
#   你的配置里 csp_ 引用的爬虫类，除 CatVodSpider 源码自带外，
#   还来自这几个大 jar。v8 在编译时自动把它们并进 spider.jar。
#
# 使用：覆盖 .github/workflows/build-spider.yml 后 Run workflow
# 地址：https://ghfast.top/https://raw.githubusercontent.com/nzsm/tvbox-server/main/jar/spider.jar
# ============================================================
name: Build Spider Jar

on:
  workflow_dispatch:
    inputs:
      merge_old:
        description: '合并增强：把仓库现有 jar 独有的爬虫也合进来（推荐）'
        type: boolean
        default: true
      merge_external:
        description: '合并外部大 jar（666tv/69 的 pg/66tv 等，补全 csp 爬虫）'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出自仓库 tvbox-server
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 匿名拉取编译源码 CatVodSpider（public 仓库，不需要 token）
        run: |
          git clone --depth 1 https://github.com/nzsm/CatVodSpider.git src
          echo "源码已拉取: $(ls src/app/build.gradle)"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-33" "build-tools;33.0.1" >/dev/null 2>&1 || true

      - name: Gradle 编译（R8 混淆）
        run: |
          cd src
          chmod +x gradlew
          sed -i 's/targetSdk 28/targetSdk 33/' app/build.gradle
          ./gradlew :app:assembleRelease -x lint -x lintVitalRelease --no-daemon --stacktrace

      - name: 打包（合并增强：旧 jar + 外部大 jar 独有爬虫并入）
        run: |
          set -e
          cd src
          # ---- 工具链自举：baksmali / apktool 缺失则自动下载（不依赖仓库文件）----
          mkdir -p jar/3rd
          if [ ! -s jar/3rd/baksmali-2.5.2.jar ]; then
            echo "下载 baksmali-2.5.2.jar ..."
            curl -L -m 180 -o jar/3rd/baksmali-2.5.2.jar "https://ghfast.top/https://github.com/google/baksmali/releases/download/v2.5.2/baksmali-2.5.2.jar" || curl -L -m 180 -o jar/3rd/baksmali-2.5.2.jar "https://github.com/google/baksmali/releases/download/v2.5.2/baksmali-2.5.2.jar"
            ls -la jar/3rd/baksmali-2.5.2.jar
          fi
          if [ ! -s jar/3rd/apktool_2.4.1.jar ]; then
            echo "下载 apktool_2.4.1.jar ..."
            curl -L -m 180 -o jar/3rd/apktool_2.4.1.jar "https://ghfast.top/https://github.com/iBotPeaches/Apktool/releases/download/v2.4.1/apktool_2.4.1.jar" || curl -L -m 180 -o jar/3rd/apktool_2.4.1.jar "https://github.com/iBotPeaches/Apktool/releases/download/v2.4.1/apktool_2.4.1.jar"
            ls -la jar/3rd/apktool_2.4.1.jar
          fi
          head -c 2 jar/3rd/baksmali-2.5.2.jar | grep -q 'PK' || { echo "❌ baksmali 下载失败"; exit 1; }
          head -c 2 jar/3rd/apktool_2.4.1.jar | grep -q 'PK' || { echo "❌ apktool 下载失败"; exit 1; }
          echo "✅ 工具链就绪: baksmali $(stat -c%s jar/3rd/baksmali-2.5.2.jar)B / apktool $(stat -c%s jar/3rd/apktool_2.4.1.jar)B"
          DEX="app/build/intermediates/dex/release/minifyReleaseWithR8/classes.dex"
          ls -la "$DEX"
          # ---- 反编译新源码的 dex ----
          rm -rf smali_new && mkdir -p smali_new
          java -jar jar/3rd/baksmali-2.5.2.jar d "$DEX" -o smali_new
          # 配置引用的目标爬虫类：只合并这些，避免方法总数超 dex 65535 上限
          export V18_BUDGET=52000
          # ---- 提前删除 catvob（非配置爬虫，避免占用 dex 方法预算）----
          python3 -c "import shutil; shutil.rmtree('smali_new/com/github/catvob', ignore_errors=True)"
          echo "已删除 catvob，V18_USED 将只统计 catvod"
          # ---- 旧 jar 独有爬虫类：反编译备用（预算截断合并稍后执行）----
          rm -rf smali_old && mkdir -p smali_old
          java -jar jar/3rd/baksmali-2.5.2.jar d jar/spider.jar -o smali_old || true
          export V18_USED=$(python3 << 'PYX' > /tmp/v18_used.txt
          import os
          t = 0
          for dp, dn, fns in os.walk('smali_new'):
              for fn in fns:
                  if fn.endswith('.smali'):
                      with open(os.path.join(dp, fn), encoding='utf-8', errors='ignore') as f:
                          for ln in f:
                              if ln.strip().startswith('.method'): t += 1
          print(t)
          PYX)
          V18_USED=$(cat /tmp/v18_used.txt)
          merge_ext() {
            local SPID="$1"
            local R
            R=$(python3 - "$SPID" << 'PYX'
          import os, sys, shutil
          spid = sys.argv[1]
          BUDGET = int(os.environ.get('V18_BUDGET', '59000'))
          used = int(os.environ.get('V18_USED', '0'))
          TARGETS = set(os.environ.get('TARGET_CLASSES', '').split())
          cands = []
          for dp, dn, fns in os.walk(spid):
              for fn in fns:
                  if not fn.endswith('.smali'): continue
                  p = os.path.join(dp, fn)
                  rel = os.path.relpath(p, spid)
                  dest = 'smali_new/com/github/catvod/spider/' + rel
                  if os.path.exists(dest): continue
                  mcnt = sum(1 for ln in open(p, encoding='utf-8', errors='ignore') if ln.strip().startswith('.method'))
                  is_t = fn[:-6] in TARGETS
                  cands.append((0 if is_t else 1, mcnt, p, dest, fn[:-6]))
          cands.sort(key=lambda x: (x[0], x[1]))
          added = 0; n = 0; tg = 0
          for _, mcnt, p, dest, cls in cands:
              is_t = cls in TARGETS
              if not is_t and used + mcnt > BUDGET: continue
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              shutil.copy(p, dest)
              if not is_t: used += mcnt
              added += mcnt; n += 1
              if is_t: tg += 1
          import sys
          print(f"{n}类/{added}方法(目标{tg})", file=sys.stderr)
          print(added)
          PYX)
            echo "  → 本次新增 ${R} 方法" >&2
          export V18_USED=$((V18_USED + ${R:-0}))
                    }

          merge_all() {
            local SPID="$1"
            local R
            R=$(python3 - "$SPID" << 'PYX'
          import os, sys, shutil
          spid = sys.argv[1]
          BUDGET = int(os.environ.get('V18_BUDGET', '55000'))
          used = int(os.environ.get('V18_USED', '0'))
          TARGETS = set(os.environ.get('TARGET_CLASSES', '').split())
          cands = []
          for dp, dn, fns in os.walk(spid):
              for fn in fns:
                  if not fn.endswith('.smali'): continue
                  p = os.path.join(dp, fn)
                  rel = os.path.relpath(p, spid)
                  dest = 'smali_new/com/github/catvod/spider/' + rel
                  if os.path.exists(dest): continue
                  mcnt = sum(1 for ln in open(p, encoding='utf-8', errors='ignore') if ln.strip().startswith('.method'))
                  is_t = fn[:-6] in TARGETS
                  cands.append((0 if is_t else 1, mcnt, p, dest, fn[:-6]))
          cands.sort(key=lambda x: (x[0], x[1]))
          added = 0; n = 0; tg = 0
          for _, mcnt, p, dest, cls in cands:
              is_t = cls in TARGETS
              if not is_t and used + mcnt > BUDGET: continue
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              shutil.copy(p, dest)
              if not is_t: used += mcnt
              added += mcnt; n += 1
              if is_t: tg += 1
          print(f"{n}类/{added}方法(目标{tg})", file=sys.stderr)
          print(added)
          PYX)
            echo "  → 本次新增 ${R} 方法"
            export V18_USED=$((V18_USED + ${R:-0}))
                    }

          # ---- 旧 jar 独有类合并（预算截断：目标类也占预算，防大包撑爆）----
          if [ "${{ github.event.inputs.merge_old }}" = "true" ]; then
            OLD_SPIDER="smali_old/com/github/catvod/spider"
            if [ -d "$OLD_SPIDER" ]; then
              echo "--- 旧 jar 独有类（预算截断）---"
          export TARGET_CLASSES="AList Alist Anime1 App99 AppDrama AppFerr AppLY AppRJ AppV6Amns AppV7Amns AppYs AppYsV2 BLSGod BddjAmns Bili Cg51 Ddrk Dm84 Doll Duboku Eighteen FirstAid FourKHDR Gz360 HHkkAmns Hanime HuyaLiveAmns IQIYI Ikanbot Iktv Jable JavBus JavDb JianPian Keke Kkys KubaCL LiteApple Live2Vod MeijuMi MeijuTT Mgtv Miss Mp4Mov NanGua New6v NewGrV2Amns NiNi PanWebShare PanWebShareKF Push QQ SP33 SP360 SeHuaTang SeedHub ShuangXing Smb4nas Taohuazu TianQuanGuard TingShijie WexMingriys Wexduanjuvmp Wexduanjuvop Wexxpgtv WoGG Wobg Wogg XBPQ XMVideo XPath XYQHiker Xb6v Xinsj Xunlei8 YQKan Ying Yinyuetai Ysj"
              merge_all "$OLD_SPIDER" || true
            fi
          fi
          SPIDER_DIR="smali_new/com/github/catvod/spider"
          PARSER_DIR="smali_new/com/github/catvod/parser"
          JS_DIR="smali_new/com/github/catvod/js"
          echo "新源码爬虫类数: $(find $SPIDER_DIR -name '*.smali' 2>/dev/null | wc -l)"

          # ---- 防御：清理超大方法类（单方法 > ~64KB，dex 硬限制，重编译必炸）----
          python3 << 'PYX'
          import os, re
          THRESH = 8000
          import shutil
          shutil.rmtree('smali_new/com/github/catvob', ignore_errors=True)
          def scan_remove(root, tag):
              removed = []
              for dp, dn, fns in os.walk(root):
                  for fn in fns:
                      if not fn.endswith('.smali'): continue
                      p = os.path.join(dp, fn)
                      with open(p, encoding='utf-8', errors='ignore') as f:
                          lines = f.readlines()
                      in_m = False; start = 0; drop = []
                      for i, ln in enumerate(lines):
                          s = ln.strip()
                          if s.startswith('.method') and not in_m:
                              in_m = True; start = i
                          elif s == '.end method' and in_m:
                              if i - start > THRESH:
                                  removed.append((os.path.relpath(p, root), i - start + 1))
                                  drop.append((start, i + 1))
                              in_m = False
                      if drop:
                          keep = [ln for idx, ln in enumerate(lines) if not any(a <= idx < b for a, b in drop)]
                          with open(p, 'w', encoding='utf-8') as f:
                              f.writelines(keep)
              return removed
          r1 = scan_remove('smali_new/com/github/catvod', 'new')
          r2 = scan_remove('smali_new', 'all') if os.path.isdir('smali_new/com/github/catvob') else []
          print("clean big methods: new=%d catvob=%d" % (len(r1), len(r2)))
          for r in (r1 + r2)[:8]:
              print("  -", r[0], "lines", r[1])
          PYX

          # ---- 合并增强②：拉取外部大 jar（666tv/69），全包补入独有类（含依赖）----
          if [ "${{ github.event.inputs.merge_external }}" = "true" ]; then
            echo "进入合并增强模式②（外部大 jar）……"
            EXT_DIR="smali_ext"
            rm -rf "$EXT_DIR" && mkdir -p "$EXT_DIR"
            # 外部 jar 清单（666tv/69 大而全包）
            # 外部 jar 清单（大而全包：pg/66tv/Yoursmile/CFlLnSbJ + 用户 TVbox 仓库 lem/wex/duo）
            EXT_JARS=(
              "pg.jar"
              "66tv.jar"
              "Yoursmile2.jar"
              "CFlLnSbJ"
                                                                                  )
            # 用户 nzsm/TVbox 仓库的补全包（Live2Vod/Wexxpgtv 等独有爬虫）
            EXT_JARS_USER=(
              "jar/lem1225.jar"
              "jar/wex.jar"
              "jar/duo.jar"
            )
            for jn in "${EXT_JARS[@]}"; do
              curl -L -m 120 -o "ext_$jn" "https://ghfast.top/https://raw.githubusercontent.com/666tv/69/main/jar/$jn" || true
              if [ -s "ext_$jn" ]; then
                rm -rf smali_e && mkdir -p smali_e
                java -jar jar/3rd/baksmali-2.5.2.jar d "ext_$jn" -o smali_e || true
                EXT_SPIDER="smali_e/com/github/catvod/spider"
                if [ -d "$EXT_SPIDER" ]; then
                  merge_ext "$EXT_SPIDER" || true
                fi
              else
                echo "⚠️ $jn 拉取失败，跳过"
              fi
            done
            # 影视仓大包（124.71.19.220：含 App99/AppDrama/AppLY/AppRJ/Gz360/PanWebShare/PanWebShareKF/ShuangXing/TingShijie + 全套 APP/网盘类）
            EXT_JARS_URL=(
              "http://124.71.19.220/jar/1/spider.jar"
              "https://gitee.com/lwlxh/tvhome/raw/master/o.jar"
              "https://file.icve.com.cn/file_doc/81/326/14751AFEF3EF30B1AFFFA398F1E9D961.png"
              "https://file.icve.com.cn/file_doc/874/405/DAB654F794A271C3D7A33D18ACFBFA95.jpg"
              "http://oss4liview.moji.com/thd_file/2026/09/24/06cf2230c30d9c26fa46ea79147b330d.jpg"
              "https://szyyds.cn/tv/x.jpg"
            )
            for jn in "${EXT_JARS_URL[@]}"; do
              curl -L -m 120 -H "User-Agent: okhttp/3.12.1" -o "ext_u_$(basename $jn)" "$jn" || true
              if [ -s "ext_u_$(basename $jn)" ]; then
                rm -rf smali_eu && mkdir -p smali_eu
                java -jar jar/3rd/baksmali-2.5.2.jar d "ext_u_$(basename $jn)" -o smali_eu || true
                EXT_SPIDER="smali_eu/com/github/catvod/spider"
                if [ -d "$EXT_SPIDER" ]; then
                  merge_ext "$EXT_SPIDER" || true
                fi
              fi
            done
            # 用户 nzsm/TVbox 仓库的补全包
            for jn in "${EXT_JARS_USER[@]}"; do
              curl -L -m 120 -o "ext_u_$(basename $jn)" "https://ghfast.top/https://raw.githubusercontent.com/nzsm/TVbox/main/$jn" || true
              if [ -s "ext_u_$(basename $jn)" ]; then
                rm -rf smali_eu && mkdir -p smali_eu
                java -jar jar/3rd/baksmali-2.5.2.jar d "ext_u_$(basename $jn)" -o smali_eu || true
                EXT_SPIDER="smali_eu/com/github/catvod/spider"
                if [ -d "$EXT_SPIDER" ]; then
                  merge_ext "$EXT_SPIDER" || true
                fi
              fi
            done
            echo "合并②后爬虫类总数: $(find $SPIDER_DIR -name '*.smali' | wc -l)"
          fi

          # ---- apktool 重打包（模板 = baksmali 反编译目录 + 动态 apktool.yml）----
          rm -rf spider_build && mkdir -p spider_build
          java -jar jar/3rd/baksmali-2.5.2.jar d jar/spider.jar -o spider_build/smali || true
          cat > spider_build/apktool.yml << 'YML'
          !!brut.androlib.meta.MetaInfo
          apkFileName: spider.jar
          compressionType: false
          doNotCompress: null
          isFrameworkApk: false
          packageInfo: null
          sdkInfo: null
          sharedLibrary: false
          sparseResources: false
          unknownFiles: {}
          usesFramework: null
          version: 2.4.1_0303
          versionInfo: null
          YML
          # 模板 catvod 全部替换为新合并产物（框架类源码 dex 已含）
          rm -rf spider_build/smali/com/github/catvod
          mkdir -p spider_build/smali/com/github
          mv smali_new/com/github/catvod spider_build/smali/com/github/catvod
          # 最终保险：打包前再清一次超大方法类
          python3 << 'PYX'
          import os
          THRESH = 8000
          import shutil
          shutil.rmtree('spider_build/smali/com/github/catvob', ignore_errors=True)
          removed = []
          for dp, dn, fns in os.walk('spider_build/smali'):
              for fn in fns:
                  if not fn.endswith('.smali'): continue
                  p = os.path.join(dp, fn)
                  with open(p, encoding='utf-8', errors='ignore') as f:
                      lines = f.readlines()
                  in_m = False; start = 0
                  for i, ln in enumerate(lines):
                      s = ln.strip()
                      if s.startswith('.method') and not in_m:
                          in_m = True; start = i
                      elif s == '.end method' and in_m:
                          if i - start > THRESH:
                              removed.append(os.path.relpath(p, 'spider_build/smali'))
                              in_m = False
                              break
                          in_m = False
                  if removed and removed[-1] == os.path.relpath(p, 'spider_build/smali'):
                      os.remove(p)
          print("final clean big methods: %d" % len(removed))
          for r in removed[:8]:
              print("  -", r)
          PYX
          # ---- 迭代式打包：失败自动解析毒类删除重试（最多6轮）----
          for attempt in 1 2 3 4 5 6; do
            if java -jar jar/3rd/apktool_2.4.1.jar b spider_build -c 2>apktool_err.log; then
              echo "✅ apktool b 成功 (第 $attempt 轮)"
              break
            fi
            cls=$(grep -oP 'Lcom/[a-zA-Z0-9/$_]+' apktool_err.log | head -1)
            if [ -z "$cls" ]; then
              echo "❌ 无法解析报错类，日志前30行："
              head -30 apktool_err.log
              exit 1
            fi
            rel=$(echo "$cls" | sed 's/^L//;s/;$//')
            # 核心基类保护：Spider 基类绝不能删（删了全部爬虫失效）
            case "$rel" in
              com/github/catvod/crawler/Spider|com/github/catvod/crawler/SpiderReq|com/github/catvod/crawler/SpiderReq*)
                echo "❌ 报错的是核心基类 $rel —— 说明 R8 产物异常，终止"
                head -30 apktool_err.log
                exit 1
                ;;
            esac
            f="spider_build/smali/$rel.smali"
            if [ -f "$f" ]; then
              # 配置引用的目标类保护：宁可失败也不删（删了对应影视源失效）
              clsname=$(basename "$rel" .smali)
              if echo "$TARGET_CLASSES" | grep -qw "$clsname"; then
                echo "❌ 报错的是配置引用目标类 $rel —— 预算仍不足，终止（请降低 V18_BUDGET 重跑）"
                head -30 apktool_err.log
                exit 1
              fi
              echo "⚠️ 第 $attempt 轮: 删除毒类 $rel"
              rm -f "$f"
            else
              echo "❌ 报错类 $rel 不在 smali 中，终止"
              head -30 apktool_err.log
              exit 1
            fi
          done
          cp spider_build/dist/spider.jar spider.jar
          md5sum spider.jar | awk '{print $1}' > spider.jar.md5
          echo "✅ 产出: spider.jar ($(du -h spider.jar | cut -f1))"

      - name: 回写本仓库 jar/spider.jar（GitHub API 直传，tvbox-server）
        run: |
          set -e
          SHA=""
          EXIST=$(curl -s -o /tmp/exist.json -w "%{http_code}" -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/nzsm/tvbox-server/contents/jar/spider.jar")
          if [ "$EXIST" = "200" ]; then
            SHA=$(python3 -c 'import json; print(json.load(open("/tmp/exist.json")).get("sha",""))')
            echo "检测到已存在 jar/spider.jar，将覆盖更新 (sha=$SHA)"
          fi
          {
            printf '{"message":"auto: 云编译 spider.jar %s","content":"' "$(date +%Y%m%d-%H%M)"
            base64 -w0 src/spider.jar
            if [ -n "$SHA" ]; then
              printf '","sha":"%s"}' "$SHA"
            else
              printf '"}'
            fi
          } > /tmp/payload.json
          echo "payload 大小: $(stat -c %s /tmp/payload.json) 字节"
          curl -s -X PUT -H "Authorization: Bearer ${{ github.token }}" \
            --data-binary @/tmp/payload.json \
            "https://api.github.com/repos/nzsm/tvbox-server/contents/jar/spider.jar" > /tmp/result.json || true
          python3 -c 'import json,sys; d=json.load(open("/tmp/result.json")); ok=d.get("content",{}).get("sha"); print(("OK 写回成功 sha="+ok[:10]+" size="+str(d["content"].get("size",""))) if ok else ("FAIL "+str(d.get("message","未知响应"))[:300])); sys.exit(0 if ok else 1)'

      - name: 上传附件（网页可直接下载）
        uses: actions/upload-artifact@v4
        with:
          name: spider_jar
          path: src/spider.jar
