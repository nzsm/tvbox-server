# ============================================================
# 全能引擎 jar 云编译工作流（双产物）
# 作用：定时 + 手动触发，自动发现并拉取各影视源引用的 jar → 类级合并去重
#       → 按 dex 64K 上限分 dex → 最小内存重汇编 → 产出两个 jar 并回写仓库：
#   1) jar/all_qist_spider.jar  全量版：收录所有能拿到的类与原生库（不论大小），
#                               作为"防人家源删库"的兜底。
#   2) jar/qist_spider.jar      完美版：依赖闭包裁剪，只保留配置实际引用的
#                               csp 爬虫类 + 依赖链，体积可控且源不缺类。
# 触发机制：
#   * schedule：每天 06:00 / 18:00（北京时间）自动轮询各源仓库，对方更新即重新合并
#   * workflow_dispatch：可在 Actions 页手动点「Run workflow」随时跑
# 保存路径：.github/workflows/build-engine.yml
# 产物地址（本仓库自托管）：
#   https://gh-proxy.com/https://raw.githubusercontent.com/nzsm/tvbox-server/main/jar/qist_spider.jar
#   https://gh-proxy.com/https://raw.githubusercontent.com/nzsm/tvbox-server/main/jar/all_qist_spider.jar
# ============================================================
name: 全能引擎jar云编译

on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = 北京时间 06:00
    - cron: '0 10 * * *'   # UTC 10:00 = 北京时间 18:00
  workflow_dispatch:
    inputs:
      mode:
        description: '生成哪些：both(两个) / all(仅全量) / closure(仅完美版)'
        type: choice
        default: both
        options: [both, all, closure]
      method_target:
        description: '每个 dex 的方法数上限（默认 22000，越小越稳但 dex 越多）'
        type: number
        default: 22000
      java_mem:
        description: '编译内存上限（最小内存，默认 2g，按需可调 1g/2g/3g）'
        type: string
        default: '2g'

permissions:
  contents: write          # 用内置 token 自动提交推送，无需配置密钥

concurrency:
  group: engine-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存工具链（baksmali/smali，避免每次重下 Maven 依赖）
        uses: actions/cache@v4
        with:
          path: .merge_tools
          key: merge-tools-${{ runner.os }}

      - name: 运行全能 jar 合并脚本（双产物，最小内存）
        env:
          MODE: ${{ github.event.inputs.mode || 'both' }}
          JAVA_MEM: ${{ github.event.inputs.java_mem || '2g' }}
          DEX_METHOD_TARGET: ${{ github.event.inputs.method_target || 22000 }}
        run: |
          python3 merge_engine.py

      - name: 提交并推送（有变化才提交）
        run: |
          git config user.name "nzsm-bot"
          git config user.email "nzsm@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "auto: 云编译引擎jar $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 上传 jar 附件（网页可直接下载）
        uses: actions/upload-artifact@v4
        with:
          name: engine_jars
          path: |
            jar/qist_spider.jar
            jar/all_qist_spider.jar
          if-no-files-found: warn
