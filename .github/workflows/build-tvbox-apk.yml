name: TVBox Build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: echo ---- 源码结构 ----
        run: |
          ls tvboxos-src | head -20

      - name: 设置 JDK 17
        # v6: setup-java v4 已弃用, 升到 v5
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 还原你的keystore签名文件
      - name: Restore keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_FILE }}
        run: |
          echo "$KS_B64" | base64 -d > tvboxos-src/app/release.jks

      # 编译，开启并行加速
      - name: Build Release APK
        env:
          KEYSTORE_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd tvboxos-src
          ./gradlew :app:assembleRelease --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-apk
          path: tvboxos-src/app/build/outputs/apk/release/app-release.apk
