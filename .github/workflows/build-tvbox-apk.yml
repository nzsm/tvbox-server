# ============================================================
# 云编译 TVBoxOS APK（q215613905/TVBoxOS 最新源码）—— 稳定版 v7（无锁清晰度）
# 用法：放进 tvbox-server/.github/workflows/ 后，Actions 页 Run workflow
# v7 在 v6 基础上的补充：
#   1. 【权限】显式声明 contents: write，保证回写 APK 不会 403
#   2. 【清理】回写前删除 apk/ 里所有旧 .apk，目录只留最新产物
#   3. 【下载链接】回写后自动生成 apk/下载链接.txt（含 raw 直链）
#   4. 【安全】keystore 密码优先读 GitHub Secrets.KEYSTORE_PASS，未设置时用默认
# 产物：单个 APK（arm64 python64），重签后回写仓库 apk/
# ============================================================
name: 云编译 TVBoxOS APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: 云编译 TVBoxOS APK（arm64 稳定版）
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 检出本仓库（tvbox-server）
        uses: actions/checkout@v4
      - name: 拉取 TVBoxOS 最新源码
        run: |
          git clone --depth 1 --branch main https://github.com/q215613905/TVBoxOS.git tvboxos-src
          echo "--- 源码结构 ---"
          ls tvboxos-src | head -20
      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: 安装 Python 3.9（chaquo 交叉编译必需）
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: 安装 Gradle（用 wrapper 版本）
        uses: gradle/actions/setup-gradle@v4
      - name: 应用版本号 + 创建 local.properties + 加大编译内存
        working-directory: tvboxos-src
        run: |
          TAG=$(date +%Y%m%d-%H%M)
          echo "TAG=${TAG}" >> $GITHUB_ENV
          # 版本号替换为编译时间
          sed -i "/versionName/s#[0-9a-zA-Z_\.\'\"-]\+\$#\'${TAG}\'#" app/build.gradle || true
          grep -n "versionName" app/build.gradle | head -3 || true
          # 【关键修复】创建 local.properties 指向 Android SDK
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          else
            echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          fi
          cat local.properties
          # 【关键修复2】pyramid 模块把 buildPython 写死成 Windows 路径
          sed -i 's#buildPython("D:[^"]*")#buildPython("python")#g' pyramid/build.gradle || true
          grep -n "buildPython" pyramid/build.gradle || echo "（pyramid 无 buildPython 行）"
          # 加大 Gradle JVM 堆（防 OOM）
          if [ -f gradle.properties ]; then
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          else
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" > gradle.properties
          fi
          cat gradle.properties
      - name: 编译 arm64 变体（python64）
        working-directory: tvboxos-src
        run: |
          chmod +x gradlew
          echo "=== 编译 python64（arm64）变体，低并行防 OOM ==="
          ./gradlew assemblePython64Release --no-daemon --max-workers=2 --stacktrace 2>&1 | tee /tmp/gradle.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "=== 编译退出码: ${EXIT_CODE} ==="
          if [ ${EXIT_CODE} -ne 0 ]; then
            echo "!!! 编译失败，最后 80 行日志："
            tail -80 /tmp/gradle.log
            exit 1
          fi
      - name: 收集 APK（只收本次新编译产物）
        run: |
          set -e
          mkdir -p apk-out
          FOUND=0
          for f in $(find tvboxos-src/app/build/outputs -name "*.apk" 2>/dev/null | grep -i "release"); do
            cp "$f" "apk-out/$(basename "$f")"
            FOUND=1
          done
          echo "找到 APK 数量: ${FOUND}"
          ls -la apk-out/
          if [ ${FOUND} -eq 0 ]; then
            echo "!!! 没有找到编译产物"
            exit 1
          fi
      - name: 用正式签名重签 APK（失败即中止）
        env:
          KS_PASS: "${{ secrets.KEYSTORE_PASS || 'tvbox2026' }}"
        run: |
          set -e
          KS="keystore/tvbox.keystore"
          if [ -f "$KS" ]; then
            echo "发现 keystore，开始正式签名..."
            BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ 2>/dev/null | tail -1)
            ZA="${BT}zipalign"
            APKS="${BT}apksigner"
            for f in apk-out/*.apk; do
              [ -f "$f" ] || continue
              echo "签名中: $f"
              "$ZA" -f 4 "$f" "$f.align"
              "$APKS" sign --ks "$KS" --ks-pass pass:${KS_PASS} --key-pass pass:${KS_PASS} --out "$f.signed" "$f.align"
              mv -f "$f.signed" "$f"
              rm -f "$f.align"
              "$APKS" verify "$f" || { echo "!!! 签名验证失败: $f"; exit 1; }
              echo "签名验证通过: $f"
            done
          else
            echo "仓库无 keystore/tvbox.keystore，使用编译产物原始签名（装前需卸载旧版）"
          fi
      - name: 上传 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxOS-APK-arm64
          path: apk-out/*
          if-no-files-found: error
      - name: 清理旧 APK + 回写最新 APK + 生成下载链接
        run: |
          set -e
          TOKEN="${{ github.token }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          cd apk-out
          cat > /tmp/upload.py <<'PYEOF'
import json, base64, sys, urllib.request, os
TOKEN, REPO, APKDIR = sys.argv[1], sys.argv[2], sys.argv[3]
def api(url, method='GET', data=None):
    req = urllib.request.Request(url, method=method,
        headers={'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json'})
    body = json.dumps(data).encode() if data is not None else None
    try:
        with urllib.request.urlopen(req, body) as r:
            return json.loads(r.read().decode())
    except Exception as e:
        return {'error': str(e)}
# 1) 删除 apk/ 下所有旧 .apk（目录只留最新产物）
lst = api('https://api.github.com/repos/%s/contents/apk' % REPO)
if isinstance(lst, list):
    for it in lst:
        if it.get('name', '').endswith('.apk'):
            r = api(it['url'] + '?sha=' + it['sha'], 'DELETE')
            print('删旧APK:', it['name'], '→', r.get('message', r))
else:
    print('apk/ 目录不存在或为空，跳过清理')
# 2) 上传新 APK
for fn in os.listdir(APKDIR):
    if not fn.endswith('.apk'):
        continue
    content = base64.b64encode(open(os.path.join(APKDIR, fn), 'rb').read()).decode()
    r = api('https://api.github.com/repos/%s/contents/apk/%s' % (REPO, fn), 'PUT',
            {'message': '云编译 TVBoxOS APK ' + fn, 'content': content})
    print('上传:', fn, '→', r.get('message', r))
    if 'error' in r:
        sys.exit('!!! 上传失败: ' + str(r))
    raw = 'https://raw.githubusercontent.com/%s/main/apk/%s' % (REPO, fn)
    pages = 'https://nzsm.github.io/tvbox-server/apk/%s' % fn
    open('/tmp/link.txt', 'w', encoding='utf-8').write(
        '最新 APK（手机浏览器打开即下载）：\n' + raw + '\n备用链接：\n' + pages + '\n')
# 3) 上传下载链接文件
if os.path.exists('/tmp/link.txt'):
    content = base64.b64encode(open('/tmp/link.txt', 'rb').read()).decode()
    r = api('https://api.github.com/repos/%s/contents/apk/下载链接.txt' % REPO, 'PUT',
            {'message': '更新下载链接', 'content': content})
    print('下载链接 →', r.get('message', r))
PYEOF
          python3 /tmp/upload.py "$TOKEN" "$REPO" "$(pwd)"
          echo "--- 完成，仓库 apk/ 已更新（只含最新 APK + 下载链接.txt） ---"
