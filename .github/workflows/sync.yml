# GitHub Actions 工作流：云端自动同步影视源与 jar
# 保存路径：.github/workflows/sync.yml（放进你仓库的这个目录）
# 作用：每天 06:00 / 18:00（北京时间）自动拉三源→解密→下载jar到仓库jar/→合并生成nzsm.txt→自动提交推送
#       也可在 Actions 页手动点「Run workflow」随时触发
name: 自动同步影视源与jar

on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = 北京时间 06:00
    - cron: '0 10 * * *'   # UTC 10:00 = 北京时间 18:00
  workflow_dispatch:       # 手动触发按钮

permissions:
  contents: write          # 允许自动提交推送（用内置 token，无需你配置密钥）

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装解密依赖
        run: pip install pycryptodome
      - name: 运行同步脚本
        run: python sync.py
      - name: 提交并推送（有变化才提交）
        run: |
          git config user.name "nzsm-bot"
          git config user.email "nzsm@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "auto: 同步影视源与jar $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi
