# ============================================================
# 云编译 TVBoxOS APK（q215613905/TVBoxOS 最新源码）
# 用法：放进 tvbox-server/.github/workflows/ 后，Actions 页 Run workflow
# 每次运行：自动拉取 TVBoxOS 最新 main → 编译 → 回写本仓库 apk/ 目录
# 产出（TVBoxOS 是单 app 模块，一般出 32位/64位/all 全量 变体）：
#   TVBox_release-*.apk   全部变体（重签后回写 apk/）
# 与原 build-tvbox-apk.yml（takagen99/Box）的区别：
#   上游从 Box 换成 q215613905/TVBoxOS —— 就是你一直想要的"人家的 app"
#   （全搜源数标题 / 横竖屏手动切换 / 配置解析容错 / FongMi 系播放器）
# ============================================================
name: 云编译 TVBoxOS APK

on:
  workflow_dispatch:

jobs:
  build:
    name: 云编译 TVBoxOS APK（全变体）
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出本仓库（tvbox-server）
        uses: actions/checkout@v4

      - name: 拉取 TVBoxOS 最新源码
        run: |
          git clone --depth 1 --branch main https://github.com/q215613905/TVBoxOS.git tvboxos-src
          echo "--- 源码结构 ---"
          ls tvboxos-src | head -20
          echo "--- gradle wrapper 版本 ---"
          cat tvboxos-src/gradle/wrapper/gradle-wrapper.properties 2>/dev/null | grep distributionUrl

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Python 3.9（chaquo 交叉编译必需，3.12+ 会报 pip 兼容错误）
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 安装 Gradle（用 wrapper 版本）
        uses: gradle/actions/setup-gradle@v4

      - name: 应用版本号 + crosswalk 镜像（防挂，容错执行）
        working-directory: tvboxos-src
        run: |
          TAG=$(date +%Y%m%d-%H%M)
          echo "TAG=${TAG}" >> $GITHUB_ENV
          # 版本号替换为编译时间（sed 不匹配也不报错）
          sed -i "/versionName/s#[0-9a-zA-Z_\.\'\"-]\+\$#\'${TAG}\'#" app/build.gradle || true
          grep -n "versionName" app/build.gradle | head -3 || true
          # crosswalk 源防挂（只加镜像，不改功能）
          if grep -q 'crosswalk' build.gradle; then
            sed -i "/crosswalk/a\        maven { url 'https://o0halflife0o.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle || true
          else
            sed -i "/jitpack.io/a\        maven { url 'https://o0halflife0o.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle || true
          fi
          echo "=== 环境诊断 ==="
          java -version 2>&1 | head -2

      - name: 编译全部 APK 变体
        working-directory: tvboxos-src
        run: |
          chmod +x gradlew
          echo "=== 开始编译（输出完整记录到日志） ==="
          ./gradlew assemblerelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          echo "=== 编译退出码: ${PIPESTATUS[0]} ==="

      - name: 收集 APK
        run: |
          mkdir -p apk-out
          for f in $(find ~ -name "*release*.apk" 2>/dev/null); do
            cp "$f" "apk-out/$(basename "$f")"
          done
          echo "--- 编译产物 ---"
          ls -la apk-out/

      - name: 用正式签名重签 APK（如仓库有 keystore）
        run: |
          KS="keystore/tvbox.keystore"
          if [ -f "$KS" ]; then
            echo "发现 keystore，开始正式签名..."
            BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ 2>/dev/null | tail -1)
            ZA="${BT}zipalign"
            APKS="${BT}apksigner"
            for f in apk-out/TVBox_*.apk; do
              [ -f "$f" ] || continue
              "$ZA" -f 4 "$f" "$f.align"
              "$APKS" sign --ks "$KS" --ks-pass pass:tvbox2026 --key-pass pass:tvbox2026 --out "$f.signed" "$f.align"
              mv -f "$f.signed" "$f"
              rm -f "$f.align"
              "$APKS" verify "$f" >/dev/null 2>&1 && echo "签名验证通过: $f" || echo "签名验证失败: $f"
            done
          else
            echo "仓库无 keystore/tvbox.keystore，使用编译产物原始签名（装前需卸载旧版）"
          fi

      - name: 上传 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxOS-APK全变体
          path: apk-out/*
          if-no-files-found: error

      - name: 回写 APK 到本仓库 apk/ 目录
        run: |
          set -e
          TOKEN="${{ github.token }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          cd apk-out
          for f in *.apk; do
            [ -f "$f" ] || continue
            echo "上传 ${f} ..."
            python3 -c "import base64,json,sys; fn=sys.argv[1]; json.dump({'message':'云编译 TVBoxOS APK '+fn,'content':base64.b64encode(open(fn,'rb').read()).decode()}, open('/tmp/payload.json','w'))" "$f"
            for i in 1 2 3 4 5; do
              curl -s -X PUT -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
                --data-binary @/tmp/payload.json \
                "https://api.github.com/repos/${REPO}/contents/apk/${f}" -o /tmp/up_resp.json
              MSG=$(python3 -c "import json;d=json.load(open('/tmp/up_resp.json'));print(d.get('message',''))" 2>/dev/null || echo "")
              if [ -z "$MSG" ] || [ "$MSG" = "created" ] || [ "$MSG" = "updated" ]; then
                echo "OK -> apk/${f}"
                break
              fi
              echo "第 ${i} 次失败: ${MSG}，3 秒后重试..."
              sleep 3
            done
          done
          echo "--- 完成，仓库 apk/ 目录已更新 ---"
